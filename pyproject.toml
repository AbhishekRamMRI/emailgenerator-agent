[project]
name = "emailgenerator-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AbhishekRamMRI", email = "abhishek.ram@mrisoftware.com" }
]
requires-python = ">=3.13"
dependencies = [
    "azure-identity>=1.25.3",
    "fastmcp>=3.4.7",
    "langchain>=1.3.15",
    "langchain-azure-ai[hosting]>=1.2.4",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "openai>=3.3.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
]

[project.scripts]
emailgenerator-agent = "emailgenerator_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
